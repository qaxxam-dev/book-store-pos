name: book_store_pos
description: "Book Store POS Application."
publish_to: 'none'
version: 1.1.10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

  # UI/UX
  google_fonts: ^6.3.2
  fl_chart: ^1.1.0
  flutter_typeahead: ^5.2.0
  vibration: ^3.1.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  path_provider: ^2.1.3
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  package_info_plus: ^8.0.0

  # File Handling
  file_picker: ^10.3.7
  cunning_document_scanner: ^1.0.4
  excel: ^4.0.2
  archive: ^3.6.1

  # AI Integration
  google_generative_ai: ^0.4.4

  # Hardware Integration
  mobile_scanner: ^7.1.3
  printing: ^5.13.2
  pdf: ^3.11.0
  image: ^4.3.0
  flutter_phoenix: ^1.1.1
  http: ^1.6.0
  shared_preferences: ^2.5.3
  esc_pos_utils_plus: ^2.0.4
  blue_thermal_printer: ^1.2.3
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/images/launcher_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    background_color: "#2196F3"
    theme_color: "#2196F3"
